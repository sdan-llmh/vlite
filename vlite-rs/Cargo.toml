[package]
name = "vlite"
version = "2.0.0"
edition = "2021"
description = "A simple and blazing fast vector database — production-grade hybrid search in ~500 lines of Rust"
license = "AGPL-3.0"
authors = ["Surya Dantuluri <surya@suryad.com>"]
keywords = ["vector", "database", "search", "embeddings", "rag"]
categories = ["database", "science"]

[dependencies]
# Vector index: HNSW + SimSIMD + quantization + save/load
usearch = "2.24.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# ONNX Runtime for embeddings + reranking (optional — for auto-embed)
ort = { version = "2.0.0-rc.12", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.16", optional = true }

# PDF text extraction (optional)
pdf-extract = { version = "0.10.0", optional = true }

[features]
default = []
embed = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
pdf = ["dep:pdf-extract"]
full = ["embed", "pdf"]

[dev-dependencies]
tempfile = "3"
