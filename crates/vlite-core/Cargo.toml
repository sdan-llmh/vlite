[package]
name = "vlite-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Rust core for the next-generation VLite vector database"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
